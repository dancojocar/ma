name: unieats
description: UniEats — discover and review campus dining spots.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  material_ui: ^1.11.1
  dio: ^5.9.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.3
  unieats_data:
    path: packages/unieats_data
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.7.0
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true

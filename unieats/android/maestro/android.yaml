appId: com.unieats.app
name: UniEats Android — list → detail → describe this dish → back
---
# Needs the server running on the host (the emulator reaches it as 10.0.2.2:3000).
# Granting permissions up front keeps the notification prompt out of the flow.
- launchApp:
    clearState: true
    permissions:
      all: allow

- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
- tapOn:
    id: "login-email"
- inputText: "student@unieats.app"
- tapOn:
    id: "login-password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login-submit"

- extendedWaitUntil:
    visible:
      id: "spot-list-item"
    timeout: 20000
- assertVisible: "UniEats"
- tapOn:
    id: "spot-list-item"
    index: 0

- scrollUntilVisible:
    element:
      id: "spot-detail-reviews"
    direction: DOWN
- assertVisible: 'Reviews \(\d+\)'

- scrollUntilVisible:
    element:
      id: "describe-dish-button"
    direction: UP
- tapOn:
    id: "describe-dish-button"
- extendedWaitUntil:
    visible:
      id: "dish-description"
    timeout: 15000

- back
- assertVisible:
    id: "spot-list-item"
    index: 0
